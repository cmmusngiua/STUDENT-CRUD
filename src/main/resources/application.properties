spring.application.name=user-api

# ==========================================
# DATASOURCE CONFIGURATION (Render & Local)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_user}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:ADMIN}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# SERVER PORT (Render passes PORT)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
